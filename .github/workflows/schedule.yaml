name: AI-Repository-Scrapper

on:
    schedule:
        - cron: '0 */6 * * *'
    workflow_dispatch:

jobs:
    scrape_and_digest:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Python Setup
              uses: actions/setup-python@v5
              with:
                    python-version: "3.10"
                    cache: "pip"

            - name: Install dep
              run: |
                  pip install -r requirements.txt
            
            - name: Running The Scrapper
              env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
              run: |
                  python scraper/github_velocity.py