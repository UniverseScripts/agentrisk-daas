apiVersion: v1
kind: Secret
metadata:
  name: daas-secrets
  namespace: daas-production
type: Opaque
stringData:
  # =================================================================
  # MANUAL MODIFICATION REQUIRED
  # Fill in the exact credentials before applying this manifest!
  # =================================================================
  
  # 1. PostgreSQL Authentication
  POSTGRES_USER: "daas_admin"
  POSTGRES_PASSWORD: "daas_admin_password"
  POSTGRES_DB: "daas_db"
  
  # 2. FastAPI / SQLAlchemy Connection String
  # Format: postgresql+asyncpg://[POSTGRES_USER]:[POSTGRES_PASSWORD]@postgres-service:5432/[POSTGRES_DB]
  # Note: You MUST URL-encode symbols (e.g. @ becomes %40) in your password.
  DATABASE_URL: "postgresql+asyncpg://daas_admin:daas_admin_password@postgres-service:5432/daas_db"
  
  # 3. Redis Edge Rate Limiter
  REDIS_URL: "redis://redis-service:6379/0"
  
  # 4. Cryptographic Validation
  LEMON_SQUEEZY_WEBHOOK_SECRET: ""
