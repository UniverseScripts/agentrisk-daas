apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: daas-ingress
  namespace: daas-production
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web, websecure
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api/v1/ai-developer-velocity
            pathType: Prefix
            backend:
              service:
                name: fastapi-service
                port:
                  number: 80
          - path: /webhooks/lemon-squeezy
            pathType: Exact
            backend:
              service:
                name: fastapi-service
                port:
                  number: 80
