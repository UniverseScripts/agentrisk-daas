apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-deployment
  namespace: daas-production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fastapi-core
  template:
    metadata:
      labels:
        app: fastapi-core
    spec:
      initContainers:
        - name: alembic-migration
          image: daas-api:latest
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: daas-secrets
                  key: DATABASE_URL
      containers:
        - name: fastapi-server
          image: daas-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: daas-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: daas-secrets
                  key: REDIS_URL
            - name: LEMON_SQUEEZY_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: daas-secrets
                  key: LEMON_SQUEEZY_WEBHOOK_SECRET

---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-service
  namespace: daas-production
spec:
  selector:
    app: fastapi-core
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP